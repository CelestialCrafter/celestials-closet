[package]
name = "celestials-closet"
version = "0.1.0"
edition = "2021"
build = "build/main.rs"

[build-dependencies]
eyre = "0.6.14"
proc-macro2 = "1.0.107"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd", "html"] }
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-nix = "0.3.0"
tree-sitter-fish = "3.6.0"
tree-sitter-lua = "0.5.0"
html-escape = "0.2.15"
toml = "1.1.5"
pulldown-cmark-escape = { version = "0.11.0", features = ["simd"] }
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }

[dependencies]
askama = "0.16.1"
eyre = "0.6.14"
grass = { version = "0.13.4", features = ["macro"] }
log = "0.4.34"
pico-args = "0.5.0"
pretty_env_logger = "0.5.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4.3", features = ["compression-gzip", "server"] }
